services:
  backend:
    image: harbor.gftinnovation.eu/humaine/humaine-al-api:v0.6.3
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIO_PREFIX=PROD_TEST
      - MINIO_USERNAME=${MINIO_USERNAME}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - DUCKDB_PATH=storage/db/humal.duckdb
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/
      - TASK_QUEUE=xai_jobs
      - RESULT_QUEUE=xai_results
      - USE_RABBITMQ=0
      - MESSAGE_VERSION=0.3
      - JWT_SECRET_KEY=this-is-a-humal-jwt-secret
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
    networks:
      - humal-network

networks:
  humal-network:
    driver: bridge
